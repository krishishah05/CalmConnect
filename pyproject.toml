[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calmconnect"
version = "0.2.0"
description = "A personal journal with lightweight sentiment analysis, for the terminal and the browser."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "textblob>=0.18",
    "rich>=13.0",
]

[project.scripts]
calmconnect = "cli.main:main"

[tool.setuptools]
packages = ["app", "api", "cli"]

[tool.setuptools.package-data]
api = ["templates/*.html", "static/*"]

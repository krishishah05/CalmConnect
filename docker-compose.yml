services:
  calmconnect:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - CALMCONNECT_SECRET_KEY=${CALMCONNECT_SECRET_KEY:-}
      # Day boundaries for streaks and stats use this timezone.
      - TZ=${TZ:-UTC}
